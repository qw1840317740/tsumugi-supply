                  <stop offset="1" stop-color="#FFE9C4" stop-opacity="0"/>

                  <line x1="20" y1="56" x2="200" y2="56"/>
                  <line x1="20" y1="76" x2="200" y2="76"/>
                  <line x1="20" y1="96" x2="200" y2="96"/>

                <ellipse cx="40" cy="28" rx="48" ry="9" fill="#E8DAB8"/>

                <circle cx="32" cy="22" r="1.2" fill="#D9C49A" opacity=".7"/>
                <circle cx="46" cy="20" r="1" fill="#D9C49A" opacity=".7"/>
                <circle cx="40" cy="18" r="1.4" fill="#D9C49A" opacity=".7"/>

                <rect x="0" y="0" width="80" height="3" fill="#7E5A32"/>

                  <rect x="13" y="14" width="3" height="6"/>
                  <rect x="20" y="14" width="3" height="6"/>

                  <rect x="55" y="14" width="3" height="6"/>
                  <rect x="62" y="14" width="3" height="6"/>
                  <rect x="69" y="14" width="3" height="6"/>
                </g>
              </g>
              <!-- Small bottle/serum (left side, behind towel) -->
              <g transform="translate(220 220) rotate(-3)">
                <ellipse cx="20" cy="62" rx="22" ry="4" fill="#3a2c1a" opacity=".2"/>
                <path d="M6 10 L34 10 L34 60 Q34 64 30 64 L10 64 Q6 64 6 60 Z" fill="#3A6B5A"/>
                <rect x="2" y="2" width="36" height="9" fill="#21463D"/>
                <rect x="14" y="32" width="16" height="22" fill="#F4ECDD" opacity=".95"/>
                <text x="22" y="46" font-family="Inter, sans-serif" font-size="5" fill="#21463D" text-anchor="middle" font-weight="700">SERUM</text>
              </g>
              <!-- Subtle leaf shadow under the tray (light side) -->
              <ellipse cx="240" cy="380" rx="280" ry="14" fill="#3a2c1a" opacity=".08"/>
            </svg>
